<!-- Category Chips Container with CSS Snap -->
<div class="hero-categories-snap" id="categorySnapContainer">
  <a href="#stock" class="hero-cat">
    <span class="hero-cat-thumb">
      <img src="https://zaodealfarmer.pages.dev/images/ibigori.jpg" alt="Ibigori" loading="lazy">
    </span>
    <span class="hero-cat-info">
      <span class="hero-cat-name">Ibigori</span>
      <span class="hero-cat-sub">Bihari</span>
    </span>
    <span class="hero-cat-arrow">›</span>
  </a>
  <a href="#stock" class="hero-cat">
    <span class="hero-cat-thumb">
      <img src="https://zaodealfarmer.pages.dev/images/colta.png" alt="Ibishyimbo" loading="lazy">
    </span>
    <span class="hero-cat-info">
      <span class="hero-cat-name">Ibishyimbo</span>
      <span class="hero-cat-sub">Bihari</span>
    </span>
    <span class="hero-cat-arrow">›</span>
  </a>
  <a href="#stock" class="hero-cat">
    <span class="hero-cat-thumb">
      <img src="https://zaodealfarmer.pages.dev/images/amasaka.jpg" alt="Amasaka" loading="lazy">
    </span>
    <span class="hero-cat-info">
      <span class="hero-cat-name">Amasaka</span>
      <span class="hero-cat-sub">Bihari</span>
    </span>
    <span class="hero-cat-arrow">›</span>
  </a>
</div>

<script>
  // Automatic step-pause centering script
  (function() {
    const container = document.getElementById('categorySnapContainer');
    if (!container) return;
    let currentIndex = 0;
    const items = container.querySelectorAll('.hero-cat');
    
    setInterval(() => {
      currentIndex = (currentIndex + 1) % items.length;
      items[currentIndex].scrollIntoView({
        behavior: 'smooth',
        block: 'nearest',
        inline: 'center'
      });
    }, 2500); // Pauses for 2.5 seconds at each centered pill
  })();
</script>
